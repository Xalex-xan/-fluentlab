name: Verificar FluentLab

on:
  push:
    branches: [main, development/fluentlab-3.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Pruebas de lógica y compatibilidad
        run: node --test tests/fluentlab.test.cjs
      - name: Preparar Playwright para Chrome del runner
        run: npm install --no-package-lock --no-save --ignore-scripts playwright@1.58.2
      - name: Probar escritorio, móvil y Service Worker
        run: node tests/browser.cjs
